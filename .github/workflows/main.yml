name: Build from ZIP URL

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL directa del .zip (Drive, Dropbox, Mega, GitHub, etc.)"
        required: true
        type: string
      build_type:
        description: "Tipo de proyecto"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - android-gradle
          - cmake
          - make
          - c-simple

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el ZIP
        run: |
          mkdir -p work && cd work
          URL="${{ inputs.zip_url }}"
          # Dropbox: forzar descarga directa
          URL="${URL/dl=0/dl=1}"
          # Google Drive: soporte para enlaces /file/d/ID/
          if [[ "$URL" == *"drive.google.com/file/d/"* ]]; then
            ID=$(echo "$URL" | sed -E 's#.*/file/d/([^/]+).*#\1#')
            pip install -q gdown
            gdown "https://drive.google.com/uc?id=$ID" -O project.zip
          else
            curl -L --fail --retry 3 -o project.zip "$URL"
          fi
          ls -lh project.zip

      - name: Extraer
        run: |
          cd work
          unzip -q project.zip -d src
          # Si el zip trae una sola carpeta raíz, entrar en ella
          COUNT=$(ls -1 src | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -d "src/$(ls -1 src)" ]; then
            mv "src/$(ls -1 src)" proj
          else
            mv src proj
          fi
          ls proj

      - name: Detectar tipo de proyecto
        id: detect
        run: |
          cd work/proj
          T="${{ inputs.build_type }}"
          if [ "$T" = "auto" ]; then
            if [ -f gradlew ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then T=android-gradle
            elif [ -f CMakeLists.txt ]; then T=cmake
            elif [ -f Makefile ]; then T=make
            else T=c-simple
            fi
          fi
          echo "type=$T" >> "$GITHUB_OUTPUT"
          echo "Tipo detectado: $T"

      # ---------- ANDROID ----------
      - uses: actions/setup-java@v4
        if: steps.detect.outputs.type == 'android-gradle'
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        if: steps.detect.outputs.type == 'android-gradle'

      - name: Compilar Android (APK)
        if: steps.detect.outputs.type == 'android-gradle'
        run: |
          cd work/proj
          if [ ! -f gradlew ]; then
            sudo apt-get install -y gradle
            gradle assembleDebug
          else
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

      # ---------- CMAKE ----------
      - name: Compilar CMake
        if: steps.detect.outputs.type == 'cmake'
        run: |
          cd work/proj
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      # ---------- MAKE ----------
      - name: Compilar Make
        if: steps.detect.outputs.type == 'make'
        run: |
          cd work/proj
          make -j"$(nproc)"

      # ---------- C SIMPLE ----------
      - name: Compilar C simple
        if: steps.detect.outputs.type == 'c-simple'
        run: |
          cd work/proj
          mkdir -p out
          for f in *.c; do
            [ -f "$f" ] && gcc -O2 -Wall "$f" -o "out/${f%.c}"
          done

      # ---------- SUBIR RESULTADOS ----------
      - name: Reunir resultados
        run: |
          mkdir -p result
          cd work/proj
          find . \( -name "*.apk" -o -name "*.aab" -o -name "*.so" \) \
            -not -path "*/intermediates/*" -exec cp --parents {} ../../result/ \; || true
          [ -d out ] && cp -r out ../../result/ || true
          [ -d build ] && find build -maxdepth 2 -type f -executable \
            -exec cp --parents {} ../../result/ \; || true
          find ../../result -type f

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: result/
          if-no-files-found: warn
          
